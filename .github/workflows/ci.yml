name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: True

jobs:
  test:
    name: >-
      Python ${{ matrix.python-version }} on ${{ matrix.os }}
      ${{ matrix.variant && format(' - {0}', matrix.variant) || '' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            variant: "minimal"

          - os: ubuntu-latest
            python-version: "3.11"

          - os: ubuntu-latest
            python-version: "3.12"

          - os: ubuntu-latest
            python-version: "3.13"

          - os: macos-latest
            python-version: "3.13"

          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create short temp directory (Windows only)
        if: runner.os == 'Windows'
        run: mkdir C:\tmp
        shell: cmd

      - name: Set environment variables (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TMP=C:\tmp" >> $env:GITHUB_ENV
          echo "TEMP=C:\tmp" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: test
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            python=${{ matrix.python-version }}
          cache-downloads: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install pescador and test dependencies
        run: |
          if [ "${{ matrix.variant }}" == "minimal" ]; then
            uv pip install --prefix "$CONDA_PREFIX" --resolution=lowest-direct -e ".[tests]"
          else
            uv pip install --prefix "$CONDA_PREFIX" -e ".[tests]"
          fi

      - name: Environment info
        run: |
          micromamba info
          uv pip list --prefix "$CONDA_PREFIX"

      - name: Run tests
        run: |
          pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pescadores/pescador
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
          name: codecov-umbrella
